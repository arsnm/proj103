<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Controller</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <section class="panel full-width">
            <h2>Robot Selection</h2>
            <select id="robotIdSelect">
                <option value="">--Select a Robot--</option>
            </select>
        </section>

        <section class="panel">
            <h2>Status</h2>
            <div class="status-panel">
                <div id="position">Position: (0, 0, 0)</div>
                <div id="speed">Speed: (0, 0)</div>
                <div id="mode">Mode: manual</div>
                <div id="target">Target: (0, 0)</div>
            </div>
        </section>

        <section class="panel">
            <h2>Camera Feed</h2>
            <div id="videoContainer"></div>
                <video id="video" width="1280" height="800" controls autoplay>
                    <source src="http://192.168.0.115:8080/static/stream.m3u8" type="application/x-mpegURL">
                    Your browser does not support the video tag.
                </video>:
            <div id="frameTimestamp"></div>
        </section>

        <section class="panel">
            <h2>Controls</h2>
            <div class="mode-toggle">
                <button class="active">Manual</button>
                <button>Automatic</button>
                <button>Target</button>
            </div>

            <div class="control-panel">
                <div class="speed-control">
                    <label for="speedSlider">Speed: <span id="speedSliderValue">50</span></label>
                    <input type="range" id="speedSlider" min="0" max="100" value="50">
                </div>

                <div class="control-buttons">
                    <button id="forwardBtn">↑</button>
                    <button id="leftBtn">←</button>
                    <button id="rightBtn">→</button>
                    <button id="backwardBtn">↓</button>
                </div>

                <div class="target-controls">
                    <div class="target-toggle">
                        <button class="active">Coordinates</button>
                        <button>Case</button>
                    </div>

                    <div class="coordinates-container active">
                        <input type="text" id="coordX" placeholder="X">
                        <input type="text" id="coordY" placeholder="Y">
                    </div>

                    <div class="case-container">
                        <input type="text" id="case" placeholder="Case (e.g., A1)">
                    </div>

                    <button id="sendTarget">Send Target</button>
                </div>
            </div>
        </section>

        <section class="panel full-width">
            <h2>System Log</h2>
            <div id="logs"></div>
        </section>

        <section class="panel">
            <button id="disconnectClient">Disconnect Client</button>
            <button id="disconnectRobot">Disconnect Robot</button>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
